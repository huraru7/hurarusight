<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ふらる | hurarunium</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/decor.css" />
  <link rel="stylesheet" href="css/link-buttons.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/about.css" />
  <link rel="stylesheet" href="css/why.css" />
  <link rel="stylesheet" href="css/contact.css" />

  <!-- 固定背景(Three.js)を CDN(esm.sh) から読み込む -->
  <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0"
        }
      }
    </script>
</head>

<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- 固定背景装飾 -->
  <div class="decorative-lines">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>
  <div class="dots-pattern"></div>
  <div class="barcode"></div>
  <div class="geometric-shape shape-1"></div>
  <div class="geometric-shape shape-2"></div>
  <div class="geometric-shape shape-3"></div>

  <main class="site">
    <!-- ① ファーストビュー -->
    <section class="hero" id="hero">
      <div class="hero__avatar" aria-hidden="true" data-hero-avatar></div>
      <h1 class="hero__name" data-bind="profile.name">ふらる</h1>
      <p class="hero__tagline" data-bind="profile.tagline">Wanderer of Worlds</p>
      <div class="hero__links link-buttons" data-hero-links></div>
      <div class="hero__scroll-hint" aria-hidden="true">↓</div>
    </section>

    <!-- ② 人柄紹介 -->
    <section class="about" id="about">
      <p class="section-label">ABOUT</p>
      <div class="about__body" data-about-body></div>
    </section>

    <!-- ③ なぜ色々作るのか -->
    <section class="why" id="why">
      <div class="why__body" data-why-body></div>
    </section>

    <!-- ④ 連絡先（再掲） -->
    <section class="contact" id="contact">
      <p class="contact__thanks" data-bind="contactNote">ここまで読んでくれて、ありがとうございます。</p>
      <div class="contact__links link-buttons" data-contact-links></div>
    </section>
  </main>

  <!-- ヘッダー -->
  <script type="module">
    import { initHeader } from "./js/header.js";
    initHeader();
  </script>

  <!-- 固定背景 -->
  <script type="module">
    import { initBackground } from "./js/background.js";
    const canvas = document.getElementById("bg-canvas");
    if (canvas) initBackground(canvas);
  </script>

  <!-- サイトの動き（data/content.js を読み込むためモジュール） -->
  <script type="module" src="js/main.js"></script>

  <!-- 各セクションの DOM 生成 -->
  <script type="module" src="js/hero.js"></script>
  <script type="module" src="js/about.js"></script>
  <script type="module" src="js/why.js"></script>
  <script type="module" src="js/contact.js"></script>
</body>

</html>
