<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>huraru</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/terminal.css" />
    <link rel="stylesheet" href="css/fragments.css" />

    <!-- ターミナル用フォント（JetBrains Mono）/ 断片収集モーダル用フォント（Crimson Text） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Crimson+Text:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- hurarunium.echo("threshold") -->

    <!-- 粒子アニメ用に Three.js を CDN(esm.sh) から読み込む準備（まだ描画はしない） -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0"
        }
      }
    </script>
  </head>
  <body>
    <!-- 粒子アニメを描く背景キャンバス（今は空＝何も描いていない） -->
    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <main class="site">
      <!-- ファーストビュー（玄関） -->
      <section class="hero">
        <h1 class="hero__title">huraru</h1>
        <p class="hero__tagline" data-bind="profile.tagline">Wanderer of Worlds</p>

        <div class="hero__scroll" aria-hidden="true">
          <span class="hero__scroll-text">Scroll</span>
          <span class="hero__arrow">↓</span>
        </div>

        <span class="frag-trigger-03" aria-hidden="true" style="position:absolute;bottom:6px;right:6px;width:10px;height:10px;opacity:0.02;"></span>
      </section>

      <!-- ここから下に少しずつセクションを足していきます。
           内容は data/content.js を編集すれば反映されます。

           ▼ 自己紹介を出したくなったら、このコメントを外すだけ:
           <section id="about">
             <div data-intro></div>
           </section>

           ▼ リンク一覧を出したくなったら、このコメントを外すだけ:
           <nav id="links">
             <ul data-links></ul>
           </nav>
      -->
    </main>

    <!-- サイトの動き（data/content.js を読み込むためモジュール） -->
    <script type="module" src="js/main.js"></script>

    <!-- 粒子アニメの足場（Three.js モジュール。準備だけで描画はしていない） -->
    <script type="module" src="js/particles.js"></script>

    <!-- ターミナルコンソール（裏の顔・独立モジュール。` か Cmd/Ctrl+K で開く） -->
    <script type="module" src="js/terminal/index.js"></script>

    <!-- 断片収集システムの行動トリガー（裏の顔の一部） -->
    <script type="module" src="js/fragments/triggers.js"></script>
  </body>
</html>
