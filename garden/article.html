<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>庭 | ふらる</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/decor.css" />
    <link rel="stylesheet" href="../css/garden.css" />

    <script type="importmap">
      {
        "imports": {
          "marked": "https://esm.sh/marked@12.0.2",
          "three": "https://esm.sh/three@0.160.0"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <!-- 固定背景装飾 -->
    <div class="decorative-lines">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="dots-pattern"></div>
    <div class="barcode"></div>
    <div class="geometric-shape shape-1"></div>
    <div class="geometric-shape shape-2"></div>
    <div class="geometric-shape shape-3"></div>

    <main class="garden-page">
      <a class="garden-page__back" href="index.html">← 庭にもどる</a>

      <article class="garden-article" data-article-root>
        <p class="garden-article__genre" data-article-genre></p>
        <h1 class="garden-article__title" data-article-title></h1>

        <button class="tending-header" data-tending-header aria-expanded="false" aria-controls="tending-log">
          <span data-tending-label></span>
        </button>

        <hr />

        <div class="garden-article__body" data-article-body></div>

        <div class="tending-log" id="tending-log" data-tending-log></div>
      </article>
    </main>

    <script type="module">
      import { initBackground } from "../js/background.js";
      const canvas = document.getElementById("bg-canvas");
      if (canvas) initBackground(canvas);
    </script>
    <script type="module" src="../js/garden/article.js"></script>
  </body>
</html>
